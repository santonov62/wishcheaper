<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="style.css" rel="stylesheet">
</head>
<body>
<div id="content">
    <div id="buttons">
        <button id="vk" type="button" class="btn btn-vk waves-effect waves-light hidden">
            <i class="fab fa-vk pr-1"></i> Авторизоваться
        </button>
        <button id="add" type="button" class="btn btn-add waves-effect waves-light hidden">
            <i class="fab pr-1"></i> Сохранить
        </button>
    </div>
    <div id="message" class="hidden"></div>
    <div id="success" class="hidden">
        Добавлено!
        <br />
        <button id="open" >Открыть</button>
    </div>
    <div id="error" class="hidden">
        <div>Печалька :(</div>
        <ul>
            <li>Магазин не поддерживается</li>
            <li>На странице нет товара</li>
        </ul>
    </div>
</div>
<div id="spinner" class="lds-ring">Добавляем...<div></div><div></div><div></div><div></div></div>

<script src="popup.js"></script>
</body>
</html>
